sinks:
  - 'ObjectInputStream'
  - '\.readObject\s*\('
  - 'XMLDecoder'
  - 'XStream|fromXML'
  - 'enableDefaultTyping|activateDefaultTyping'
  - 'autoType|AutoType'
  - 'Hessian|Kryo'
  - 'new\s+Yaml\s*\(|Yaml\s*\('
guards:
  - 'SafeMode|setEnabledDefaultTyping|allowlist|Whitelist|blacklist|ClassFilter|ObjectInputFilter|setObjectInputFilter'
input:
  any: true
